<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MeuMP3</title>
<style>
:root{--bg:#f4f4f6;--panel:#fff;--panel2:#ebebef;--tx:#17171a;--mut:#6b6b75;--ac:#1db954;--line:#dcdce2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0d;--panel:#17171b;--panel2:#23232a;--tx:#f1f1f4;--mut:#9a9aa6;--line:#2c2c34;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0d;--panel:#17171b;--panel2:#23232a;--tx:#f1f1f4;--mut:#9a9aa6;--line:#2c2c34;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.app{flex:1;display:flex;min-height:0}
aside{width:240px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px;gap:8px;overflow-y:auto}
aside h1{font-size:18px;margin:0 8px 8px}
.btn{background:var(--panel2);color:var(--tx);border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font:inherit;text-align:left}
.btn:hover{filter:brightness(1.1)}.btn.pri{background:var(--ac);color:#04210e;font-weight:600}
.pl{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--mut)}
.pl:hover{background:var(--panel2);color:var(--tx)}.pl.on{background:var(--panel2);color:var(--ac);font-weight:600}
.pl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{display:flex;align-items:center;gap:12px;padding:18px 22px 10px;flex-wrap:wrap}
.top h2{margin:0;font-size:24px;flex:1;min-width:120px}
.top input{background:var(--panel2);border:0;color:var(--tx);border-radius:20px;padding:8px 14px;width:200px;font:inherit}
.list{flex:1;overflow-y:auto;padding:4px 14px 14px}
.row{display:grid;grid-template-columns:34px 44px 1fr 1fr;gap:12px;align-items:center;padding:6px 10px;border-radius:8px;cursor:pointer}
.row:hover{background:var(--panel2)}.row.on{background:var(--panel2)}.row.on .t{color:var(--ac)}
.row .n{color:var(--mut);text-align:center}
.cov{width:44px;height:44px;border-radius:6px;background:var(--panel2) center/cover;display:grid;place-items:center;color:var(--mut);font-size:18px;flex:none}
.t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{margin:auto;text-align:center;color:var(--mut);padding:40px;max-width:420px}
.empty b{display:block;font-size:20px;color:var(--tx);margin-bottom:8px}
.drop{position:absolute;inset:0;background:color-mix(in srgb,var(--ac) 25%,transparent);border:3px dashed var(--ac);display:none;place-items:center;font-size:22px;font-weight:700;z-index:5}
.drop.on{display:grid}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.15em}
.btn{display:flex;align-items:center;gap:8px}.btn .i{font-size:16px}
aside h1{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ac);color:#04210e;display:grid;place-items:center;font-size:17px}
.pl .i{margin-right:8px;font-size:15px;vertical-align:-.2em}
.row .n svg{color:var(--ac)}
.ib{display:grid;place-items:center}.cov .i{font-size:20px}
footer{background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:16px;align-items:center;padding:10px 18px}
.now{display:flex;gap:12px;align-items:center;min-width:0}.now .cov{width:56px;height:56px}
.ctl{display:flex;flex-direction:column;gap:6px;align-items:center}
.btns{display:flex;gap:10px;align-items:center}
.ib{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:50%}
.ib:hover{color:var(--tx)}.ib.on{color:var(--ac)}
.play{background:var(--tx);color:var(--bg);width:42px;height:42px;font-size:18px}.play:hover{color:var(--bg);transform:scale(1.06)}
.seek{display:flex;gap:8px;align-items:center;width:100%;color:var(--mut);font-size:12px}
input[type=range]{accent-color:var(--ac);flex:1;min-width:0;cursor:pointer}
.vol{display:flex;gap:8px;align-items:center;justify-content:flex-end}.vol input{max-width:120px}
@media (max-width:760px){aside{display:none}.row{grid-template-columns:44px 1fr}.row .n,.row .a{display:none}footer{grid-template-columns:1fr;gap:8px}.vol{display:none}.top input{width:100%}}

<script>
const $=s=>document.querySelector(s);
const audio=new Audio();
let tracks=[],view='__all',queue=[],qi=-1,shuffle=false,rep=0,hist=[],cur=null;
const EXT=/\.(mp3|m4a|ogg|wav|flac|aac)$/i;
const ic=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const fmt=s=>{if(!isFinite(s))return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- ID3 ---------- */
function dec(b,enc){
  try{
    if(enc===1||enc===2){let le=true,o=0;if(b[0]===0xFE&&b[1]===0xFF){le=false;o=2}else if(b[0]===0xFF&&b[1]===0xFE)o=2;else if(enc===2)le=false;
      return new TextDecoder(le?'utf-16le':'utf-16be').decode(b.subarray(o)).replace(/\0+$/,'')}
    return new TextDecoder(enc===3?'utf-8':'iso-8859-1').decode(b).replace(/\0+$/,'')
  }catch(e){return''}
}
const ss=(b,o)=>(b[o]<<21)|(b[o+1]<<14)|(b[o+2]<<7)|b[o+3];
async function readTags(file){
  const r={};
  try{
    const h=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(String.fromCharCode(h[0],h[1],h[2])!=='ID3')return r;
    const ver=h[3],size=ss(h,6);
    const b=new Uint8Array(await file.slice(10,10+size).arrayBuffer());
    let o=0;const hl=ver===2?6:10;
    while(o+hl<b.length){
      const id=String.fromCharCode(...b.subarray(o,o+(ver===2?3:4)));
      if(!/^[A-Z0-9]+$/.test(id))break;
      let fs;
      if(ver===2)fs=(b[o+3]<<16)|(b[o+4]<<8)|b[o+5];
      else if(ver===4)fs=ss(b,o+4);
      else fs=((b[o+4]<<24)|(b[o+5]<<16)|(b[o+6]<<8)|b[o+7])>>>0;
      const d=b.subarray(o+hl,o+hl+fs);o+=hl+fs;
      if(!d.length)continue;
      if(id==='TIT2'||id==='TT2')r.title=dec(d.subarray(1),d[0]);
      else if(id==='TPE1'||id==='TP1')r.artist=dec(d.subarray(1),d[0]);
      else if(id==='TALB'||id==='TAL')r.album=dec(d.subarray(1),d[0]);
      else if(id==='APIC'&&!r.cover){
        const enc=d[0];let p=1;while(p<d.length&&d[p]!==0)p++;
        const mime=dec(d.subarray(1,p),0)||'image/jpeg';p+=2;
        if(enc===1||enc===2){while(p+1<d.length&&!(d[p]===0&&d[p+1]===0))p+=2;p+=2}else{while(p<d.length&&d[p]!==0)p++;p++}
        if(p<d.length){const bl=new Blob([d.subarray(p)],{type:mime.includes('/')?mime:'image/jpeg'});r.coverBlob=bl;r.cover=URL.createObjectURL(bl)}
      }
    }
  }catch(e){}
  return r;
}

/* ---------- Adicionar arquivos ---------- */
let busy=Promise.resolve(),tick;
function add(items){
  const fresh=[];
  for(const {file,path,src} of items){
    if(!((file.type||'').startsWith('audio/')||EXT.test(file.name)))continue;
    const parts=path.split('/').filter(Boolean);
    const folder=parts.length>1?parts[parts.length-2]:'Arquivos soltos';
    const t={file,src,folder,title:file.name.replace(/\.[^.]+$/,''),artist:'Artista desconhecido',cover:null,id:tracks.length+fresh.length};
    const k=kid(t);if(keys.has(k))continue;keys.add(k);fresh.push(t);
  }
  tracks.push(...fresh);draw();
  busy=busy.then(async()=>{for(const t of fresh){await loadMeta(t);
    clearTimeout(tick);tick=setTimeout(draw,150);if(t===cur)setNow(t)}draw()});
}
const fromInput=fl=>addAny([...fl].map(f=>({file:f,path:f.webkitRelativePath||f.name})));
$('#fDir').onchange=e=>{fromInput(e.target.files);e.target.value=''};
$('#fFiles').onchange=e=>{fromInput(e.target.files);e.target.value=''};
$('#addDir').onclick=()=>$('#fDir').click();
$('#addFiles').onclick=()=>$('#fFiles').click();

async function walk(entry,out){
  if(entry.isFile){await new Promise(res=>entry.file(f=>{out.push({file:f,path:entry.fullPath});res()},res))}
  else if(entry.isDirectory){
    const rd=entry.createReader();
    for(;;){const es=await new Promise(res=>rd.readEntries(res,()=>res([])));if(!es.length)break;for(const e of es)await walk(e,out)}
  }
}
const main=$('#main'),drop=$('#drop');let dc=0;
addEventListener('dragenter',e=>{e.preventDefault();if(e.dataTransfer.types.includes('Files')){dc++;drop.classList.add('on')}});
addEventListener('dragleave',e=>{dc--;if(dc<=0){dc=0;drop.classList.remove('on')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',async e=>{
  e.preventDefault();dc=0;drop.classList.remove('on');if(!e.dataTransfer.types.includes('Files'))return;
  const es=[...e.dataTransfer.items].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  const out=[];
  if(es.length){for(const en of es)await walk(en,out)}
  else for(const f of e.dataTransfer.files)out.push({file:f,path:f.name});
  addAny(out);
});

/* ---------- Estado ---------- */
let ac,an,fd,raf;
const ELE=typeof require==='function'&&!!(window.process&&process.versions&&process.versions.electron);
let nfs,ipc,wu;if(ELE){nfs=require('fs');const el=require('electron');ipc=el.ipcRenderer;wu=el.webUtils}
const keys=new Set(),kid=t=>t.folder+'/'+t.file.name+'|'+t.file.size;
let upNext=[],pls=[],favs=[],srcs=[],sel=new Set(),anchor=null,sort={k:'n',d:1},seeking=false,tt,lastSave=0,dk=null,qd=null;
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||d)}catch(e){return JSON.parse(d)}};
pls=load('pls','[]');favs=load('favs','[]');
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const savePls=()=>save('pls',pls),isPl=v=>v.startsWith('pl:'),fs=$('#fs'),curPl=()=>pls.find(p=>'pl:'+p.id===view);
const isFav=t=>favs.includes(kid(t));
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
const fmtLong=s=>{const h=Math.floor(s/3600),m=Math.round(s%3600/60);return h?`${h} h ${m} min`:`${m} min`};

/* ---------- Arquivos locais (Electron) e duração ---------- */
const lf=p=>({name:p.split('/').pop(),size:nfs.statSync(p).size,path:p,slice:(a,b)=>({arrayBuffer:async()=>{const fdn=nfs.openSync(p,'r');try{const buf=Buffer.alloc(b-a),n=nfs.readSync(fdn,buf,0,b-a,a);return buf.buffer.slice(buf.byteOffset,buf.byteOffset+n)}finally{nfs.closeSync(fdn)}}})});
const srcOf=t=>URL.createObjectURL(t.file.path?new Blob([nfs.readFileSync(t.file.path)],{type:'audio/mpeg'}):t.file);
function getDur(t){return new Promise(res=>{
  const a=new Audio(),p=t.file.path,u=p?'file://'+(p[0]==='/'?'':'/')+encodeURI(p).replace(/[?#]/g,encodeURIComponent):URL.createObjectURL(t.file);
  const end=d=>{a.onerror=a.onloadedmetadata=null;a.src='';if(!p)URL.revokeObjectURL(u);res(isFinite(d)?d:0)};
  a.preload='metadata';a.onloadedmetadata=()=>end(a.duration);a.onerror=()=>end(0);a.src=u})}
function scan(p,out,root){for(const d of nfs.readdirSync(p,{withFileTypes:true})){const q=p+'/'+d.name;if(d.isDirectory())scan(q,out,root);else if(EXT.test(d.name))out.push({src:root.p,file:lf(q),path:root.name+'/'+q.slice(root.p.length+1)})}}
function addSrc(p,remember){
  try{const items=[];if(nfs.statSync(p).isDirectory())scan(p,items,{p,name:p.split('/').pop()});else if(EXT.test(p))items.push({src:p,file:lf(p),path:p.split('/').pop()});add(items)}catch(e){return}
  if(remember&&!srcs.includes(p)){srcs.push(p);save('src',srcs)}
}
function addAny(items){
  if(!ELE)return add(items);
  const tops=new Set();
  for(const {file,path:rel} of items){
    const full=wu.getPathForFile(file).replace(/\\/g,'/'),r=rel.replace(/^\//,''),parts=r.split('/');
    tops.add(parts.length>1?full.slice(0,full.length-r.length)+parts[0]:full);
  }
  tops.forEach(p=>addSrc(p,true));
}

/* ---------- Reprodução ---------- */
function tint(url){
  const r=document.documentElement.style;if(!url){r.removeProperty('--tint');return}
  const im=new Image();im.onload=()=>{
    const c=document.createElement('canvas');c.width=c.height=12;const x=c.getContext('2d');x.drawImage(im,0,0,12,12);
    const d=x.getImageData(0,0,12,12).data;let R=0,G=0,B=0,W=0;
    for(let i=0;i<d.length;i+=4){const w=.2+(Math.max(d[i],d[i+1],d[i+2])-Math.min(d[i],d[i+1],d[i+2]))/255;R+=d[i]*w;G+=d[i+1]*w;B+=d[i+2]*w;W+=w}
    r.setProperty('--tint',`rgb(${R/W|0},${G/W|0},${B/W|0})`)};
  im.src=url;
}

  $('#nt').textContent=$('#ft').textContent=t.title;
  $('#na').textContent=t.artist+(t.album?' • '+t.album:'');$('#fa').textContent=t.artist;
  for(const id of ['#ncov','#fcov']){const e=$(id);e.style.backgroundImage=c;e.innerHTML=t.cover?'':ic('music')}
  $('#fsbg').style.backgroundImage=c;tint(t.cover);updHeart();
  document.title=t.title+' — '+t.artist;
  if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album||'',artwork:t.cover?[{src:t.cover}]:[]});
}
function playT(t,nohist){
  if(cur&&!nohist){hist.push(cur);if(hist.length>100)hist.shift()}
  cur=t;const k=queue.indexOf(t);if(k>=0)qi=k;
  initAudio();
  if(audio._u)URL.revokeObjectURL(audio._u);
  audio._u=srcOf(t);audio.src=audio._u;
  audio.play().catch(()=>{});setNow(t);draw();drawQ();
}
const play=i=>{if(i>=0&&i<queue.length)playT(queue[i])};
function next(auto){
  if(upNext.length)return playT(upNext.shift());
  if(!queue.length)return;
  if(shuffle&&queue.length>1){let n;do{n=Math.floor(Math.random()*queue.length)}while(n===qi);return play(n)}
  if(qi+1<queue.length)return play(qi+1);
  if(rep===1)return play(0);
  if(!auto)play(0);else{audio.pause();draw()}
}

  if(audio.currentTime>3){audio.currentTime=0;return}
  if(hist.length)return playT(hist.pop(),true);
  play(qi>0?qi-1:0);
}

function initAudio(){
  if(ac)return;
  try{ac=new(window.AudioContext||window.webkitAudioContext)();const s=ac.createMediaElementSource(audio);an=ac.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.82;s.connect(an);an.connect(ac.destination);fd=new Uint8Array(an.frequencyBinCount)}catch(e){an=null}
}
function bars(c,N){
  if(!c||!c.clientWidth||!an)return;
  const x=c.getContext('2d'),d=devicePixelRatio||1,w=c.clientWidth*d,h=c.clientHeight*d;
  if(c.width!==w||c.height!==h){c.width=w;c.height=h}
  x.clearRect(0,0,w,h);an.getByteFrequencyData(fd);
  const bw=w/N,g=x.createLinearGradient(0,h,0,0);g.addColorStop(0,'#1db954');g.addColorStop(1,'#b6ffd0');x.fillStyle=g;
  for(let i=0;i<N;i++){
    const v=fd[Math.floor(Math.pow(i/N,1.7)*fd.length*.7)]/255,bh=Math.min(h,Math.max(3*d,v*v*h*1.1));
    x.beginPath();x.roundRect(i*bw+bw*.15,h-bh,bw*.7,bh,bw*.35);x.fill();
  }
}
function loop(){cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);if(fs.classList.contains('on'))bars($('#vz'),56);bars($('#vz2'),36)}
function openFs(){fs.classList.add('on');try{document.documentElement.requestFullscreen()?.catch(()=>{})}catch(e){}loop()}
function closeFs(){fs.classList.remove('on');if(audio.paused)cancelAnimationFrame(raf);if(document.fullscreenElement)document.exitFullscreen()}
$('#bFs').onclick=openFs;$('#fsx').onclick=closeFs;
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&fs.classList.contains('on'))closeFs()});
$('#bMini').onclick=()=>{const on=!document.body.classList.contains('mini');document.body.classList.toggle('mini',on);ipc&&ipc.send('mini',on)};

addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyA'){e.preventDefault();visible().forEach(t=>sel.add(kid(t)));draw()}
  else if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.code==='KeyF')fs.classList.contains('on')?closeFs():openFs();
  else if(e.code==='Escape'){if($('#mgr').classList.contains('on'))$('#mgr').classList.remove('on');else if(fs.classList.contains('on'))closeFs();else if(sel.size){sel.clear();draw()}}
  else if(e.code==='ArrowRight'&&e.shiftKey)next(false);
  else if(e.code==='ArrowLeft'&&e.shiftKey)prev();
  else if(e.code==='ArrowRight')audio.currentTime+=5;
  else if(e.code==='ArrowLeft')audio.currentTime-=5;
  else if(e.code==='ArrowUp'){e.preventDefault();setVol(Math.min(100,+$('#vol').value+5))}
  else if(e.code==='ArrowDown'){e.preventDefault();setVol(Math.max(0,+$('#vol').value-5))}
});
if('mediaSession'in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>audio.play());m.setActionHandler('pause',()=>audio.pause());m.setActionHandler('nexttrack',()=>next(false));m.setActionHandler('previoustrack',prev)}

/* ---------- Cache e gerenciador de pastas ---------- */
let db=null,lastRef=Date.now();const cache=new Map();
const dbReady=new Promise(res=>{try{
  const r=indexedDB.open('meump3',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onerror=()=>res();
  r.onsuccess=()=>{db=r.result;const q=db.transaction('m').objectStore('m'),k=q.getAllKeys(),v=q.getAll();v.onerror=()=>res();v.onsuccess=()=>{k.result.forEach((key,i)=>cache.set(key,v.result[i]));res()}}
}catch(e){res()}});
const cput=(k,v)=>{try{db&&db.transaction('m','readwrite').objectStore('m').put(v,k)}catch(e){}};
async function loadMeta(t){
  await dbReady;const k=kid(t),c=cache.get(k);
  if(c){t.title=c.title||t.title;t.artist=c.artist||t.artist;t.album=c.album;t.dur=c.dur;t.cover=c.cover?URL.createObjectURL(c.cover):null;return}
  const g=await readTags(t.file);
  for(const f of ['title','artist','album','cover'])if(g[f])t[f]=g[f];
  t.dur=await getDur(t);
  if(t.dur){const e={title:g.title,artist:g.artist,album:g.album,dur:t.dur,cover:g.coverBlob};cache.set(k,e);cput(k,e)}
}
function dropSrcTracks(test){
  tracks=tracks.filter(t=>{if(!test(t))return true;keys.delete(kid(t));return false});
  queue=queue.filter(t=>tracks.includes(t)||t===cur);qi=queue.indexOf(cur);upNext=upNext.filter(t=>tracks.includes(t));sel.clear();
}
function refresh(){
  lastRef=Date.now();
  dropSrcTracks(t=>t.file.path&&!nfs.existsSync(t.file.path));
  srcs.forEach(p=>addSrc(p,false));draw();drawQ();
}
addEventListener('focus',()=>{if(ELE&&Date.now()-lastRef>20000)refresh()});
function openMgr(){
  $('#mgL').innerHTML=srcs.length?srcs.map((p,i)=>`<div class="mr"><span class="mp" title="${esc(p)}">${ic('folder')}${esc(p)}</span><span class="a">${tracks.filter(t=>t.src===p).length} músicas</span><button class="ib" data-r="${i}" title="Remover da biblioteca">${ic('x')}</button></div>`).join(''):'<p class="a">Nenhuma pasta salva ainda. Use “Adicionar pasta”.</p>';
  $('#mgI').textContent=`Cache: ${cache.size} música${cache.size===1?'':'s'} guardada${cache.size===1?'':'s'} (abertura mais rápida)`;
  $('#mgr').classList.add('on');
}
$('#mgL').onclick=e=>{
  const b=e.target.closest('[data-r]');if(!b)return;
  const p=srcs[+b.dataset.r];srcs.splice(+b.dataset.r,1);save('src',srcs);
  dropSrcTracks(t=>t.src===p);draw();drawQ();openMgr();toast('Pasta removida da biblioteca');
};
$('#mgr').onclick=e=>{if(e.target.id==='mgr')$('#mgr').classList.remove('on')};
$('#mgX').onclick=()=>$('#mgr').classList.remove('on');
$('#mgA').onclick=()=>$('#fDir').click();
$('#fDir').addEventListener('change',()=>setTimeout(()=>{if($('#mgr').classList.contains('on'))openMgr()},800));
$('#mgU').onclick=()=>{refresh();setTimeout(openMgr,800);toast('Biblioteca atualizada')};
$('#mgC').onclick=()=>{try{db.transaction('m','readwrite').objectStore('m').clear()}catch(e){}cache.clear();openMgr();toast('Cache limpo')};

/* ---------- Início: lembrar pastas e última música ---------- */
function resume(){
  const l=load('last','null');if(!l)return;
  const t=tracks.find(x=>kid(x)===l.k);if(!t)return;
  queue=visible();cur=t;qi=queue.indexOf(t);
  audio._u=srcOf(t);audio.src=audio._u;
  audio.addEventListener('loadedmetadata',()=>{audio.currentTime=l.p||0},{once:true});
  setNow(t);draw();drawQ();
}
if(ELE){
  srcs=load('src','[]');srcs.slice().forEach(p=>addSrc(p,false));resume();
  $('#clr').style.display='';
  $('#clr').onclick=openMgr;
}else $('#bMini').remove();
draw();drawQ();
</script>
